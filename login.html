<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMRMS Login · SNSU</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
  <div class="login-box">
    <h2>SNSU FMRMS</h2>
    <p class="login-subtitle">Sign in to submit and track maintenance requests</p>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="btn primary" onclick="login()">Sign in</button>
    <p class="login-footnote">Use <strong>student</strong> / <strong>1234</strong> or <strong>ADMIN</strong> / <strong>1234</strong> to demo.</p>
  </div>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('loggedIn') === 'true') {
        const role = localStorage.getItem('userRole') === 'ADMIN' ? 'ADMIN' : 'STUDENT';
        window.location = role === 'ADMIN' ? 'admin.html' : 'index.html';
      }
    });
  </script>
</body>
</html>
