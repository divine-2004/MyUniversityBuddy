<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications · FMRMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-body">
  <header class="top-header">
    <img class="header-logo" src="images/snsu logo.png" alt="SNSU Logo" />
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="profile-block">
          <img id="sidebarProfilePhoto" class="sidebar-avatar" src="" alt="Profile" />
          <div class="profile-info">
            <div class="profile-name" id="sidebarProfileName">Student</div>
            <div class="profile-meta" id="sidebarProfileMeta">—</div>
          </div>
        </div>

        <ul class="nav">
          <li><a href="index.html"><i class="fas fa-tachometer-alt nav-icon"></i><span class="nav-label">Dashboard</span></a></li>
          <li><a href="profile.html"><i class="fas fa-user nav-icon"></i><span class="nav-label">My Profile</span></a></li>
          <li><a href="notes.html"><i class="fas fa-list nav-icon"></i><span class="nav-label">My Requests</span></a></li>
          <li><a href="notes.html"><i class="fas fa-plus nav-icon"></i><span class="nav-label">Create Request</span></a></li>

          <li><a href="student/facility-list.html"><i class="fas fa-building nav-icon"></i><span class="nav-label">Facility List</span></a></li>

          <li><a href="student/calendar.html"><i class="fas fa-calendar nav-icon"></i><span class="nav-label">Calendar</span></a></li>

          <li><a href="notifications.html"><i class="fas fa-bell nav-icon"></i><span class="nav-label">Notifications</span></a></li>
          <li><a href="student/reports.html"><i class="fas fa-chart-bar nav-icon"></i><span class="nav-label">Reports</span></a></li>

          <li><a href="help.html"><i class="fas fa-question-circle nav-icon"></i><span class="nav-label">FAQ</span></a></li>
          <li><a href="student/settings.html"><i class="fas fa-cog nav-icon"></i><span class="nav-label">Settings</span></a></li>

        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt nav-icon"></i><span class="nav-label">Logout</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <section class="page-header">
        <h1>Notifications</h1>
        <p class="page-subtitle">Updates about request status changes and upcoming deadlines.</p>
      </section>

      <div class="card">
        <div class="notification-header">
          <h3>Recent alerts</h3>
          <button class="btn secondary" onclick="clearNotifications()">Clear all</button>
        </div>
        <ul id="notificationList" class="notification-list"></ul>
      </div>
    </main>
  </div>

  <script src="js/script.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initNotifications);</script>
</body>
</html>
