<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications · FMRMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-body">
  <header class="top-header">
    <img class="header-logo" src="images/snsu logo.png" alt="SNSU Logo" />
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="profile-block">
          <img id="sidebarProfilePhoto" class="sidebar-avatar" src="" alt="Profile" />
          <div class="profile-info">
            <div class="profile-name" id="sidebarProfileName">Student</div>
            <div class="profile-meta" id="sidebarProfileMeta">—</div>
          </div>
        </div>

        <ul class="nav">
          <li><a href="index.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a></li>
          <li><a href="notifications.html"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span></a></li>
          <li><a href="profile.html"><span class="nav-icon">🧑</span><span class="nav-label">Profile</span></a></li>
          <li><a href="notes.html"><span class="nav-icon">📝</span><span class="nav-label">Requests</span></a></li>
          <li><a href="help.html"><span class="nav-icon">❓</span><span class="nav-label">Help</span></a></li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">
          <span class="nav-icon">🚪</span><span class="nav-label">Logout</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <section class="page-header">
        <h1>Notifications</h1>
        <p class="page-subtitle">Updates about request status changes and upcoming deadlines.</p>
      </section>

      <div class="card">
        <div class="notification-header">
          <h3>Recent alerts</h3>
          <button class="btn secondary" onclick="clearNotifications()">Clear all</button>
        </div>
        <ul id="notificationList" class="notification-list"></ul>
      </div>
    </main>
  </div>

  <script src="js/script.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initNotifications);</script>
</body>
</html>
